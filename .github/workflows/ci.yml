name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API unit and integration tests
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: api}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: api/requirements.txt}
      - run: pip install -r requirements.txt
      - run: pytest -q

  web:
    name: Web type-check, unit tests and build
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (docker compose + Playwright + OIDC)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: Wait for API and Keycloak
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8000/ready && break; sleep 3; done
          for i in $(seq 1 60); do curl -sf http://localhost:8081/realms/grp-demo/.well-known/openid-configuration >/dev/null && break; sleep 3; done
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install httpx && python scripts/oidc_smoke_test.py
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - working-directory: e2e
        run: npm install && npx playwright install --with-deps chromium && npx playwright test
      - if: failure()
        run: docker compose logs --tail 200
