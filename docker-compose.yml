# Local stack: docker compose up --build
#   web       http://localhost:5173   React + MapLibre
#   api       http://localhost:8000   FastAPI (docs at /docs)
#   keycloak  http://localhost:8081   OIDC provider (demo users: viewer/viewer, analyst/analyst)
#   mcp       http://localhost:8001/mcp  MCP server over Streamable HTTP
# Demo credentials only - never use these settings in production.

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: grp
      POSTGRES_PASSWORD: grp
      POSTGRES_DB: grp
    ports: ["5434:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grp -d grp"]
      interval: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Tokens are issued for the browser-facing URL; the API reaches Keycloak internally.
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports: ["8081:8080"]
    volumes: ["./keycloak:/opt/keycloak/data/import:ro"]

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://grp:grp@db:5432/grp
      OIDC_ISSUER: http://localhost:8081/realms/grp-demo
      OIDC_JWKS_URL: http://keycloak:8080/realms/grp-demo/protocol/openid-connect/certs
      OIDC_AUDIENCE: grp-api
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5}
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports: ["8000:8000"]
    volumes: ["./data:/data:ro"]
    depends_on:
      db: {condition: service_healthy}

  mcp:
    build: ./mcp_server
    environment:
      API_BASE_URL: http://api:8000
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8001"
    ports: ["8001:8001"]
    depends_on: [api]

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:8000
        VITE_OIDC_AUTHORITY: http://localhost:8081/realms/grp-demo
        VITE_OIDC_CLIENT_ID: grp-web
    ports: ["5173:80"]
    depends_on: [api, keycloak]

volumes:
  dbdata:
